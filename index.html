<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scientific Calculator</title>
<style>
  body {
    background: #222831;
    color: #eeeeee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .calculator {
    background: #393e46;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px #00adb5;
    width: 360px;
  }
  .display {
    background: #222831;
    color: #00adb5;
    font-size: 2rem;
    padding: 15px 10px;
    border-radius: 10px;
    text-align: right;
    margin-bottom: 15px;
    user-select: none;
    min-height: 50px;
    overflow-x: auto;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  button {
    background: #00adb5;
    border: none;
    color: #222831;
    font-size: 1.1rem;
    padding: 15px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s ease;
    user-select: none;
  }
  button:hover {
    background: #007b7f;
  }
  button.operator {
    background: #ff5722;
    color: white;
  }
  button.operator:hover {
    background: #e64a19;
  }
  button.function {
    background: #393e46;
    color: #00adb5;
  }
  button.function:hover {
    background: #00adb5;
    color: #222831;
  }
  @media (max-width: 400px) {
    .calculator {
      width: 100%;
      margin: 10px;
    }
  }
</style>
</head>
<body>
<div class="calculator" role="region" aria-label="Scientific Calculator">
  <div id="display" class="display" aria-live="polite">0</div>
  <div class="buttons">
    <button class="function" data-action="clear">C</button>
    <button class="function" data-action="backspace">←</button>
    <button class="function" data-action="parenthesis">( )</button>
    <button class="operator" data-action="/">÷</button>
    <button class="operator" data-action="*">×</button>
    <button class="function" data-action="sqrt">√</button>
    <button data-action="7">7</button>
    <button data-action="8">8</button>
    <button data-action="9">9</button>
    <button class="operator" data-action="-">−</button>
    <button class="function" data-action="pow">xⁿ</button>
    <button class="function" data-action="log">log</button>
    <button data-action="4">4</button>
    <button data-action="5">5</button>
    <button data-action="6">6</button>
    <button class="operator" data-action="+">+</button>
    <button class="function" data-action="sin">sin</button>
    <button class="function" data-action="cos">cos</button>
    <button data-action="1">1</button>
    <button data-action="2">2</button>
    <button data-action="3">3</button>
    <button data-action=".">.</button>
    <button class="function" data-action="tan">tan</button>
    <button class="function" data-action="ln">ln</button>
    <button data-action="0" style="grid-column: span 2;">0</button>
    <button data-action="pi">π</button>
    <button data-action="e">e</button>
    <button class="operator" data-action="=" style="background: #00ff99;">=</button>
  </div>
</div>
<script>
  (function(){
    const display=document.getElementById('display')
    let expression=''
    let openParens=0
    let powActive=false
    let powBase=''
    function updateDisplay(){
      display.textContent=expression||'0'
    }
    function insert(val){
      expression+=val
      updateDisplay()
    }
    function clearAll(){
      expression=''
      openParens=0
      powActive=false
      powBase=''
      updateDisplay()
    }
    function backspace(){
      if(!expression)return
      let last=expression.slice(-1)
      expression=expression.slice(0,-1)
      if(last==='(')openParens--
      else if(last===')')openParens++
      updateDisplay()
    }
    function addParenthesis(){
      if(openParens===0||expression.slice(-1).match(/[\+\-\*\/\(]/)){
        expression+='('
        openParens++
      }else if(openParens>0){
        expression+=')'
        openParens--
      }else{
        expression+='('
        openParens++
      }
      updateDisplay()
    }
    function toRadians(deg){return deg*Math.PI/180}
    function evaluateExpression(expr){
      try{
        expr=expr.replace(/÷/g,'/')
        expr=expr.replace(/×/g,'*')
        expr=expr.replace(/π/g,Math.PI)
        expr=expr.replace(/e/g,Math.E)
        expr=expr.replace(/sin\(/g,'Math.sin(toRadians(')
        expr=expr.replace(/cos\(/g,'Math.cos(toRadians(')
        expr=expr.replace(/tan\(/g,'Math.tan(toRadians(')
        expr=expr.replace(/log\(/g,'Math.log10(')
        expr=expr.replace(/ln\(/g,'Math.log(')
        expr=expr.replace(/√/g,'Math.sqrt')
        expr=expr.replace(/x\^/g,'**')
        return Function('toRadians','return '+expr)(toRadians)
      }catch{
        return 'Error'
      }
    }
    document.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click',()=>{
        let val=btn.getAttribute('data-action')
        if(val==='clear'){
          clearAll()
        }else if(val==='backspace'){
          backspace()
        }else if(val==='parenthesis'){
          addParenthesis()
        }else if(val==='='){
          let res=evaluateExpression(expression)
          expression=res.toString()
          openParens=0
          updateDisplay()
        }else if(val==='sqrt'){
          expression+='√('
          openParens++
          updateDisplay()
        }else if(val==='pow'){
          expression+='**'
          updateDisplay()
        }else if(['sin','cos','tan','log','ln'].includes(val)){
          expression+=val+'('
          openParens++
          updateDisplay()
        }else if(val==='pi'){
          expression+='π'
          updateDisplay()
        }else if(val==='e'){
          expression+='e'
          updateDisplay()
        }else{
          insert(val)
        }
      })
    })
  })()
</script>
</body>
</html>
